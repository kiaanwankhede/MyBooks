<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book Learnings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Book Learnings</h1>
    <p>Tap a cover to read what the book taught, or press Listen to hear it read aloud.</p>
  </header>
  <main class="shelf" id="shelf"></main>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="sh-head">
      <div class="mini" id="mini"></div>
      <div><h2 id="sh-title"></h2><p id="sh-sub"></p></div>
      <button class="x" id="close" aria-label="Close">&times;</button>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="reader" id="reader" data-state="idle">
      <button class="play" id="play" aria-pressed="false">Listen</button>
      <button class="stop" id="stop" disabled>Stop</button>
      <label class="fld"><span>Voice</span><select id="voice"></select></label>
      <label class="fld rate"><span>Speed <output id="rate-out">1&times;</output></span><input type="range" id="rate" min="0.7" max="1.4" step="0.05" value="1"></label>
      <p class="voice-note" id="voice-note"></p>
    </div>
    <div class="body" id="body" tabindex="0"></div>
  </div>
</div>

<script src="data/books.js"></script>
<script src="app.js"></script>
</body>
</html>
